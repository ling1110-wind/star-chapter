        const closeBtn = document.getElementById('shareModalClose');
        const qrWrap   = document.getElementById('shareQR');
        const urlEl    = document.getElementById('shareURL');
        const copyBtn  = document.getElementById('copyLinkBtn');
        const saveBtn  = document.getElementById('downloadQRBtn');

        function openShare() {
          urlEl.textContent = location.href;
          qrWrap.innerHTML = `<span style="color:#aaa;">${t('share.qr.loading')}</span>`;
          mask.classList.add('show');
          document.body.style.overflow = 'hidden';
          loadQRLib().then(() => {
            qrWrap.innerHTML = '';
            try {
              new window.QRCode(qrWrap, {
                text: location.href, width: 220, height: 220,
                colorDark: getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#000',
                colorLight: getComputedStyle(document.documentElement).getPropertyValue('--surface').trim() || '#fff',
                correctLevel: window.QRCode.CorrectLevel.M
              });
              // 把生成的 canvas/img 存一个 id，供保存用
              const c = qrWrap.querySelector('canvas');
              if (c) c.id = '__qrCanvas';
              const i = qrWrap.querySelector('img');
              if (i) i.id = '__qrImg';
            } catch (e) {
              qrWrap.innerHTML = `<span style="color:var(--danger,#c0392b);">${t('share.err_qr')}</span>`;
            }
          }).catch(() => {
            qrWrap.innerHTML = `<span style="color:var(--danger,#c0392b);">${t('share.err_qr')}</span>`;
          });
        }
        function closeShare() {
          mask.classList.remove('show');
          document.body.style.overflow = '';
        }

        shareBtn.addEventListener('click', openShare);
        if (heroShareBtn) heroShareBtn.addEventListener('click', openShare);
        closeBtn.addEventListener('click', closeShare);
        mask.addEventListener('click', e => { if (e.target === mask) closeShare(); });
        copyBtn.addEventListener('click', () => copyText(location.href, t('share.ok_copy')));
        saveBtn.addEventListener('click', () => {
          try {
            const c = document.getElementById('__qrCanvas');
            const i = document.getElementById('__qrImg');
            let href = null;
            if (c) href = c.toDataURL('image/png');
            else if (i && i.src) href = i.src;
            if (!href) throw new Error('no qr');
            const a = document.createElement('a');
            a.href = href; a.download = '我的主页二维码.png';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            showToast(t('share.ok_save'));
          } catch {
            showToast(t('share.err_qr'), 'error');
          }
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && mask.classList.contains('show')) closeShare(); });
      }

      // ==================== ⑬ 导出 PDF（CDN版 jsPDF+html2canvas 兜底 window.print） ====================
      let __pdfLibLoading = false, __pdfLibReady = false;
      function loadPDFLibs() {
        if (__pdfLibReady) return Promise.resolve();
        if (__pdfLibLoading) return __pdfLibLoading._p;
        __pdfLibLoading = {};
        __pdfLibLoading._p = new Promise((resolve, reject) => {
          const need = [
            { id:'__jspdf',  url:'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',         check:()=>window.jspdf },
            { id:'__h2c',    url:'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js', check:()=>window.html2canvas }
          ];
          let done = 0, failed = false;
          need.forEach(it => {
            if (it.check()) { done++; if (done === need.length) { __pdfLibReady=true; resolve(); } return; }
            const s = document.createElement('script');
            s.src = it.url; s.async = true;
            s.onload = () => {
              if (failed) return;
              done++;
              if (done === need.length) { __pdfLibReady=true; resolve(); }
            };
            s.onerror = () => { failed = true; reject(new Error('pdf lib failed')); };
            document.head.appendChild(s);
          });
        });
        return __pdfLibLoading._p;
      }
      async function exportPDF() {
        try {
          await loadPDFLibs();
          if (!window.jspdf || !window.html2canvas) throw new Error('missing deps');
          const target = document.getElementById('mainContent') || document.body;
          showToast(window.__LANG === 'en' ? '⏳ Generating PDF…' : '⏳ 正在生成 PDF…');
          // 收起灯箱/模态
          document.getElementById('imgLightbox')?.classList.remove('show');
          document.getElementById('shareModalMask')?.classList.remove('show');
          const canvas = await window.html2canvas(target, {
            scale: Math.min(window.devicePixelRatio || 2, 2),
            useCORS: true, backgroundColor: null
          });
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
          const pageW = 210, pageH = 297;
          const margin = 8;
          const imgW = pageW - margin * 2;
          const imgH = (canvas.height * imgW) / canvas.width;
          if (imgH <= pageH - margin * 2) {
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgH);
          } else {
            // 分页：按比例切片
            const slicePxH = Math.round(canvas.width * ((pageH - margin * 2) / imgW));
            let y = 0, first = true;
            while (y < canvas.height) {
              if (!first) pdf.addPage();
              first = false;
              const h = Math.min(slicePxH, canvas.height - y);
              const off = document.createElement('canvas');
              off.width = canvas.width; off.height = h;
              off.getContext('2d').drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
              const hh = (h * imgW) / canvas.width;
              pdf.addImage(off.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, hh);
              y += h;
            }
          }
          const filename = window.__LANG === 'en' ? 'Enrui-Zhao-Homepage.pdf' : '赵恩瑞-个人主页.pdf';
          pdf.save(filename);
          showToast(t('pdf.ok'));
        } catch (e) {
          showToast(t('pdf.fallback'));
          setTimeout(() => window.print(), 200);
        }
      }

      // ==================== PWA：注册 Service Worker ====================
      function registerSW() {
        if (!('serviceWorker' in navigator)) return;
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
        });
      }

      // 初始化
      const savedPalette = localStorage.getItem('palette') || 'forest';
      setThemePalette(savedPalette);
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        body.classList.add('dark');
      }
      syncDarkIcon();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem('theme')) {
          body.classList.toggle('dark', e.matches);
          syncDarkIcon();
        }
      });
      const savedLang = localStorage.getItem('lang');
      if (savedLang === 'en' || savedLang === 'zh') window.__LANG = savedLang;

      buildPage();

      // 双语第一次应用（构建完 DOM 后）
      applyI18n(true);

      // 导航链接加 id，供 i18n 定位（buildPage 后已创建 DOM）
      (function assignNavIds(){
        const map = [
          ['关于','About','nav-about'],['亮点','Highlights','nav-highlights'],['技能矩阵','Skills','nav-skills'],['经历','Experience','nav-experience'],
          ['项目','Projects','nav-projects'],['获奖与证书','Awards','nav-awards'],['教育','Education','nav-education'],['联系方式','Contact','nav-contact']
        ];
        document.querySelectorAll('.nav-links a').forEach(a => {
          const txt = (a.textContent || '').trim();
          for (const [zhKw, enKw, id] of map) {
            if (!a.id && (txt.indexOf(zhKw) >= 0 || txt.indexOf(enKw) >= 0)) { a.id = id; break; }
          }
        });
        // hero 三个按钮（仅在缺失 id 时补齐，避免覆盖 buildPage 已写的 id）
        document.querySelectorAll('.hero-cta button, .hero-cta a').forEach((b) => {
          if (b.id) return;
          const txt = (b.textContent || '');
          if (txt.includes('下载') || txt.includes('Download')) b.id = 'heroDetailBtn';
          else if (txt.includes('联系') || txt.includes('Contact')) b.id = 'heroContactBtn';
          else if (txt.includes('PDF'))  b.id = 'heroPDFBtn';
          else if (txt.includes('分享') || txt.includes('Share')) b.id = 'heroShareBtn';
        });
        // 再次应用一次双语（确保id都挂上）
        applyI18n(false);
      })();

      // DOM 构建完成后再跑所有交互
      setupRevealAnimations();
      setupParallax();
      setupCardGlow();
      setupTiltCard();
      setupCharAnimation();
      setupShareModal();
      registerSW();
      console.log('✨ 个人简历网站已就绪 · PWA/双语/分享/PDF/3D/逐字 已启用');
    })();
  </script>
