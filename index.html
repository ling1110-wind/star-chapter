  <title>赵恩瑞 · 个人主页 | 文艺追寻者</title>
  <style>
    /* ========== CSS Reset & Design Tokens ========== */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* ========== 基础中性色 token（所有主题通用） ========== */
      --neutral-0: #ffffff;
      --neutral-50: #f7f6f4;
      --neutral-100: #eeece8;
      --neutral-200: #dcd8d2;
      --neutral-300: #c4bfb8;
      --neutral-400: #a39d95;
      --neutral-500: #7d776f;
      --neutral-600: #5c5650;
      --neutral-700: #3e3a35;
      --neutral-800: #24211e;
      --neutral-900: #141210;
      /* 语义化分配（默认浅色） */
      --bg: var(--neutral-50);
      --bg-alt: var(--neutral-100);
      --surface: var(--neutral-0);
      --surface-raised: #fdfdfc;
      --surface-overlay: rgba(255,255,255,0.88);
      --text: var(--neutral-800);
      --text-secondary: var(--neutral-600);
      --text-muted: var(--neutral-400);
      --text-on-primary: #ffffff;
      --text-on-accent: #ffffff;
      --border: var(--neutral-200);
      --border-light: var(--neutral-100);
      --border-focus: var(--primary-light);
      /* 阴影 */
      --shadow-xs: 0 1px 2px rgba(0,0,0,0.03);
      --shadow-sm: 0 2px 6px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.03);
      --shadow-md: 0 8px 22px rgba(0,0,0,0.06), 0 3px 8px rgba(0,0,0,0.04);
      --shadow-lg: 0 16px 36px rgba(0,0,0,0.08), 0 6px 16px rgba(0,0,0,0.04);
      --shadow-xl: 0 24px 52px rgba(0,0,0,0.1), 0 10px 24px rgba(0,0,0,0.06);
      --shadow-2xl: 0 32px 68px rgba(0,0,0,0.12), 0 14px 32px rgba(0,0,0,0.07);
      /* 圆角 */
      --radius-xs: 6px;
      --radius-sm: 10px;
      --radius-md: 18px;
      --radius-lg: 26px;
      --radius-xl: 34px;
      --radius-full: 9999px;
      /* 字体 */
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'WenQuanYi Micro Hei', sans-serif;
      --font-serif: 'Georgia', 'Noto Serif SC', 'STSong', 'Songti SC', 'SimSun', 'Palatino', serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', 'Monaco', monospace;
      /* 动效 */
      --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition-fast: 0.18s ease;
      --transition-base: 0.28s ease;
      --transition-slow: 0.45s ease;
      --nav-height: 70px;
      --nav-blur: 20px;
      --pattern-dots: radial-gradient(circle at 1.5px 1.5px, var(--neutral-300) 1px, transparent 1px);
    }

    /* ========== 主题切换过渡动画（HSL分量平滑过渡） ========== */
    @property --primary-h { syntax: '<number>'; inherits: true; initial-value: 145; }
    @property --primary-s { syntax: '<percentage>'; inherits: true; initial-value: 38%; }
    @property --primary-l { syntax: '<percentage>'; inherits: true; initial-value: 30%; }
    @property --accent-h { syntax: '<number>'; inherits: true; initial-value: 28; }
    @property --accent-s { syntax: '<percentage>'; inherits: true; initial-value: 42%; }
    @property --accent-l { syntax: '<percentage>'; inherits: true; initial-value: 42%; }
    @property --gold-h { syntax: '<number>'; inherits: true; initial-value: 42; }
    @property --gold-s { syntax: '<percentage>'; inherits: true; initial-value: 55%; }
    @property --gold-l { syntax: '<percentage>'; inherits: true; initial-value: 50%; }
    html, body, body::before, body::after {
      transition: background-color 0.6s cubic-bezier(.4,0,.2,1),
                  color 0.6s cubic-bezier(.4,0,.2,1),
                  --primary-h 0.6s cubic-bezier(.4,0,.2,1),
                  --primary-s 0.6s,
                  --primary-l 0.6s,
                  --accent-h 0.6s cubic-bezier(.4,0,.2,1),
                  --accent-s 0.6s,
                  --accent-l 0.6s,
                  --gold-h 0.6s,
                  --gold-s 0.6s,
                  --gold-l 0.6s,
                  --bg 0.6s cubic-bezier(.4,0,.2,1),
                  --surface 0.6s,
                  --border 0.6s,
                  --text 0.6s,
                  --hero-bg-mood 0.6s,
                  --card-bg-mood 0.6s,
                  --bg-overlay 0.6s,
                  --halo-warm 0.6s,
                  --halo-cool 0.6s,
                  --bg-scene 0.8s ease;
    }

    /* ========== 五大主题 ========== */

    /* 🌲 森林幽境 Forest (默认) */
    :root, :root[data-theme="forest"], html[data-theme="forest"] {
      --primary-h: 145; --primary-s: 38%; --primary-l: 30%;
      --primary: hsl(145, 38%, 30%);
      --primary-light: hsl(145, 32%, 46%);
      --primary-dark: hsl(145, 44%, 18%);
      --primary-soft: hsla(145, 36%, 55%, 0.14);
      --primary-soft2: hsla(145, 40%, 58%, 0.24);
      --accent-h: 28; --accent-s: 42%; --accent-l: 42%;
      --accent: hsl(28, 42%, 42%);
      --accent-light: hsl(28, 38%, 58%);
      --accent-dark: hsl(28, 48%, 28%);
      --accent-soft: hsla(28, 42%, 55%, 0.12);
      --accent-soft2: hsla(28, 40%, 52%, 0.2);
      --gold-h: 42; --gold-s: 55%; --gold-l: 50%;
      --gold: hsl(42, 55%, 50%); --gold-light: hsl(42, 50%, 64%);
      --gold-soft: hsla(42, 50%, 55%, 0.15);
      --hero-bg-mood: 155deg, #e8efe9 0%, #f3f7f4 35%, #dde9df 70%, #ceddd2 100%;
      --card-bg-mood: 140deg, #ffffff 0%, #f1f6f2 100%;
      --halo-warm: radial-gradient(600px circle at var(--hw-x, 12%) var(--hw-y, 5%), rgba(200,160,100,0.20), transparent 60%);
      --halo-cool: radial-gradient(700px circle at var(--hc-x, 85%) var(--hc-y, 35%), rgba(70,130,100,0.20), transparent 60%);
      --bg-overlay: linear-gradient(135deg, rgba(237,244,239,0.93) 0%, rgba(225,236,229,0.91) 55%, rgba(214,229,220,0.93) 100%);
      --bg-scene: url("certs/wallhaven-21o5zx_1280x720.png");
      --gradient-hero: linear-gradient(var(--hero-bg-mood));
      --gradient-card: linear-gradient(var(--card-bg-mood));
      --gradient-primary: linear-gradient(135deg, var(--primary-dark), var(--primary));
      --gradient-accent: linear-gradient(135deg, var(--accent-dark), var(--accent));
    }

    /* 🏯 灯塔海岸 Lighthouse */
    :root[data-theme="lighthouse"], html[data-theme="lighthouse"] {
      --primary-h: 205; --primary-s: 50%; --primary-l: 32%;
      --primary: hsl(205, 50%, 32%);
      --primary-light: hsl(205, 45%, 48%);
      --primary-dark: hsl(205, 58%, 18%);
      --primary-soft: hsla(205, 42%, 55%, 0.14);
      --primary-soft2: hsla(205, 46%, 58%, 0.24);
      --accent-h: 40; --accent-s: 85%; --accent-l: 55%;

      --accent-light: hsl(40, 78%, 68%);
      --accent-dark: hsl(40, 70%, 38%);
      --accent-soft: hsla(40, 70%, 58%, 0.16);
      --accent-soft2: hsla(40, 72%, 55%, 0.26);
      --gold-h: 30; --gold-s: 35%; --gold-l: 42%;
      --gold: hsl(30, 35%, 42%); --gold-light: hsl(30, 30%, 58%);
      --gold-soft: hsla(30, 30%, 50%, 0.14);
      --hero-bg-mood: 155deg, #eaf1f6 0%, #f6f9fb 35%, #dae5ef 70%, #c9d8e4 100%;
      --card-bg-mood: 140deg, #ffffff 0%, #f2f6fa 100%;
      --halo-warm: radial-gradient(600px circle at var(--hw-x, 60%) var(--hw-y, 18%), rgba(255,210,110,0.28), transparent 60%);
      --halo-cool: radial-gradient(700px circle at var(--hc-x, 18%) var(--hc-y, 42%), rgba(60,120,170,0.22), transparent 60%);
      --bg-overlay: linear-gradient(135deg, rgba(234,243,250,0.92) 0%, rgba(218,234,245,0.88) 55%, rgba(200,220,236,0.92) 100%);
      --bg-scene: url("certs/wallhaven-3q2rqd_1600x900.png");
      --gradient-hero: linear-gradient(var(--hero-bg-mood));
      --gradient-card: linear-gradient(var(--card-bg-mood));
      --gradient-primary: linear-gradient(135deg, var(--primary-dark), var(--primary));
      --gradient-accent: linear-gradient(135deg, var(--accent-dark), var(--accent));
    }

    /* 🌅 暮野归人 Dusk */
    :root[data-theme="dusk"], html[data-theme="dusk"] {
      --primary-h: 248; --primary-s: 28%; --primary-l: 28%;
      --primary: hsl(248, 28%, 28%);
      --primary-light: hsl(248, 24%, 44%);
      --primary-dark: hsl(248, 34%, 14%);
      --primary-soft: hsla(248, 26%, 55%, 0.14);
      --primary-soft2: hsla(248, 30%, 58%, 0.24);
      --accent-h: 15; --accent-s: 78%; --accent-l: 52%;
      --accent: hsl(15, 78%, 52%);
      --accent-light: hsl(15, 70%, 66%);

      --accent-soft: hsla(15, 70%, 58%, 0.16);
      --accent-soft2: hsla(15, 72%, 55%, 0.26);
      --gold-h: 32; --gold-s: 80%; --gold-l: 58%;

      --gold-soft: hsla(32, 65%, 60%, 0.18);
      --hero-bg-mood: 155deg, #ece7ee 0%, #f4eef4 35%, #e0d6e4 70%, #cdbfd4 100%;
      --card-bg-mood: 140deg, #ffffff 0%, #f3eff4 100%;

      --halo-cool: radial-gradient(700px circle at var(--hc-x, 22%) var(--hc-y, 28%), rgba(80,70,140,0.24), transparent 60%);
      --bg-overlay: linear-gradient(135deg, rgba(236,230,238,0.90) 0%, rgba(222,210,228,0.87) 55%, rgba(205,190,214,0.91) 100%);
      --bg-scene: url("certs/wallhaven-lydkg2_1600x900.png");

      --gradient-card: linear-gradient(var(--card-bg-mood));

    /* 🐉 龙吟古城 Dragon */
    :root[data-theme="dragon"], html[data-theme="dragon"] {
      --primary-h: 4; --primary-s: 65%; --primary-l: 36%;
      --primary: hsl(4, 65%, 36%);
      --primary-light: hsl(4, 56%, 52%);
      --primary-dark: hsl(4, 72%, 20%);

      --gold-h: 40; --gold-s: 40%; --gold-l: 48%;

      --halo-warm: radial-gradient(600px circle at var(--hw-x, 20%) var(--hw-y, 30%), rgba(200,60,40,0.24), transparent 60%);

      --bg-scene: url("certs/wallhaven-qrolqd_1600x900.png");

    /* 🏔️ 雪峰天境 Snowpeak */
    :root[data-theme="snowpeak"], html[data-theme="snowpeak"] {
      --primary-h: 208; --primary-s: 32%; --primary-l: 38%;

    /* ========== 深色模式：各主题覆盖 ========== */
    /* 🌲 Forest Dark */
    html[data-theme="forest"] body.dark, :root[data-theme="forest"] body.dark {
      --bg: #0f1714; --bg-alt: #151f1b; --surface: #182420; --surface-raised: #1e2c27;

      --pattern-dots: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.05) 1px, transparent 1px);
      --hero-bg-mood: 155deg,#131c18 0%,#1a2620 40%,#151f1b 70%,#0e1612 100%;

    }
    /* 🏯 Lighthouse Dark */
    html[data-theme="lighthouse"] body.dark, :root[data-theme="lighthouse"] body.dark {
      --bg: #0d161e; --bg-alt: #13202c; --surface: #162634; --surface-raised: #1c3040;
      --surface-overlay: rgba(22,38,52,0.9);
      --text: #e0ecf5; --text-secondary: #a9bccb; --text-muted: #6d8295;
      --text-on-primary: #08121a; --text-on-accent: #2a1a04;

      --gradient-card: linear-gradient(var(--card-bg-mood));

      --gradient-accent: linear-gradient(135deg, var(--accent-dark), var(--accent-light));

    /* 🌅 Dusk Dark */
    html[data-theme="dusk"] body.dark, :root[data-theme="dusk"] body.dark {
      --bg: #121018; --bg-alt: #1a1722; --surface: #1e1b28; --surface-raised: #252133;
      --surface-overlay: rgba(30,27,40,0.9);
      --text: #e6e2ed; --text-secondary: #b2abd0; --text-muted: #7b7596;
      --text-on-primary: #0a0814; --text-on-accent: #1a0804;
      --border: #2e2940; --border-light: #252133;
      --pattern-dots: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.04) 1px, transparent 1px);
      --hero-bg-mood: 155deg,#17131f 0%,#1f1a2a 40%,#191524 70%,#100d18 100%;
      --card-bg-mood:140deg,#231d2e 0%,#1b1626 100%;

    /* 🐉 Dragon Dark */
    html[data-theme="dragon"] body.dark, :root[data-theme="dragon"] body.dark {
      --bg: #15120f; --bg-alt: #1c1814; --surface: #201b17; --surface-raised: #28221d;
      --surface-overlay: rgba(32,27,23,0.9);
      --text: #e8e2dc; --text-secondary: #b1a79c; --text-muted: #7a7167;
      --text-on-primary: #140605; --text-on-accent: #061210;
      --border: #332c26; --border-light: #28221d;
      --pattern-dots: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.04) 1px, transparent 1px);
      --hero-bg-mood: 155deg,#181410 0%,#201a16 40%,#1a1612 70%,#110e0c 100%;
      --card-bg-mood:140deg,#241d18 0%,#1c1713 100%;
      --halo-warm: radial-gradient(600px circle at var(--hw-x, 20%) var(--hw-y, 30%), rgba(180,50,30,0.16), transparent 60%);
      --halo-cool: radial-gradient(700px circle at var(--hc-x, 82%) var(--hc-y, 18%), rgba(50,120,100,0.16), transparent 60%);
      --bg-overlay: linear-gradient(135deg, rgba(14,10,8,0.83) 0%, rgba(22,18,14,0.79) 55%, rgba(14,10,8,0.85) 100%);
      --gradient-hero: linear-gradient(var(--hero-bg-mood));
      --gradient-card: linear-gradient(var(--card-bg-mood));
      --gradient-primary: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      --gradient-accent: linear-gradient(135deg, var(--accent-dark), var(--accent-light));
    }
    /* 🏔️ Snowpeak Dark */
    html[data-theme="snowpeak"] body.dark, :root[data-theme="snowpeak"] body.dark {
      --bg: #0e141a; --bg-alt: #141c24; --surface: #17202a; --surface-raised: #1e2936;
      --surface-overlay: rgba(23,32,42,0.9);
      --text: #e2ebf3; --text-secondary: #aab7c6; --text-muted: #708091;
      --text-on-primary: #080e14; --text-on-accent: #120d08;
      --border: #24313f; --border-light: #1e2936;
      --pattern-dots: radial-gradient(circle at 1.5px 1.5px, rgba(255,255,255,0.04) 1px, transparent 1px);
      --hero-bg-mood: 155deg,#111821 0%,#18222e 40%,#141d27 70%,#0d141c 100%;
      --card-bg-mood:140deg,#1b2633 0%,#161f2a 100%;
      --halo-warm: radial-gradient(600px circle at var(--hw-x, 70%) var(--hw-y, 65%), rgba(170,130,90,0.12), transparent 60%);
      --halo-cool: radial-gradient(700px circle at var(--hc-x, 30%) var(--hc-y, 20%), rgba(80,130,170,0.18), transparent 60%);
      --bg-overlay: linear-gradient(135deg, rgba(10,16,22,0.84) 0%, rgba(14,24,32,0.80) 55%, rgba(10,18,24,0.86) 100%);
      --gradient-hero: linear-gradient(var(--hero-bg-mood));
      --gradient-card: linear-gradient(var(--card-bg-mood));
      --gradient-primary: linear-gradient(135deg, var(--primary-dark), var(--primary-light));
      --gradient-accent: linear-gradient(135deg, var(--accent-dark), var(--accent-light));
    }

    /* 减少动画 */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    /* 全局光晕背景（用于视差） */
    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
      z-index: 0;
      top: 0; left: 0; width: 100%; height: 100%;
      will-change: transform;
      transition: opacity 0.35s;
    }
    body::before { background: var(--halo-warm); }
    body::after { background: var(--halo-cool); }

    /* hero/card 应用主题渐变 */
    .hero { background: linear-gradient(var(--hero-bg-mood)); }
    .stat-card, .card, .project-card, .skill-card, .cert-card { background: linear-gradient(var(--card-bg-mood)); }

    /* ========== 入场动画（动画A） ========== */
    .fade-up {
      opacity: 0;
      transform: translateY(24px);
      will-change: opacity, transform;
      transition: opacity 0.65s cubic-bezier(.16,1,.3,1), transform 0.65s cubic-bezier(.16,1,.3,1);
    }
    .fade-up.in {
      opacity: 1;
      transform: translateY(0);
    }
    /* 章节图标摆动入场 */
    .section-icon.in {
      animation: swing-in 0.9s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes swing-in {
      0% { opacity: 0; transform: rotate(-15deg) scale(0.7); }
      60% { opacity: 1; transform: rotate(5deg) scale(1.05); }
      100% { opacity: 1; transform: rotate(0deg) scale(1); }
    }
    /* 卡片悬停光晕 */
    .card, .stat-card, .project-card, .skill-card, .cert-card {
      position: relative;
      isolation: isolate;
    }
    .card::after, .stat-card::after, .project-card::after, .skill-card::after, .cert-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(500px circle at var(--mx, 50%) var(--my, 0%), hsla(var(--primary-h), var(--primary-s), var(--primary-l), 0.08), transparent 45%);
      opacity: 0;
      transition: opacity 0.35s;
      z-index: -1;
      pointer-events: none;
    }
    .card:hover::after, .stat-card:hover::after, .project-card:hover::after, .skill-card:hover::after, .cert-card:hover::after {
      opacity: 1;
    }
    /* 技能进度条填充动画 */
    .skill-bar-fill {
      width: 0 !important;
      transition: width 1.2s cubic-bezier(.16,1,.3,1) !important;
    }
    .skill-bar-fill.fill {
      width: var(--target, 70%) !important;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--nav-height) + 24px);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      /* 三层背景：柔光遮罩(文字可读) + 主题大图(fixed视差) + 点阵 fallback */
      background-image:
        var(--bg-overlay, linear-gradient(135deg, rgba(255,252,245,0.90) 0%, rgba(247,241,230,0.90) 100%)),
        var(--bg-scene, none),
        var(--pattern-dots);
      background-size: auto, cover, 30px 30px;
      background-position: 0 0, center top, 0 0;
      background-repeat: no-repeat, no-repeat, repeat;
      background-attachment: scroll, fixed, scroll;
      color: var(--text);
      line-height: 1.6;
      transition: background-color 0.35s, color 0.35s;
      padding-top: var(--nav-height);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow-x: hidden;
      touch-action: manipulation;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    @media (hover: none) and (pointer: coarse) {
      html { scroll-behavior: auto; }
    }

    /* 触控友好：交互元素最小44px热区 */
    button, a, .cert-card, .tab-btn, .nav-link, .project-card, .theme-btn, .back-to-top {
      min-height: 44px;
      min-width: 44px;
      -webkit-tap-highlight-color: transparent;
    }
    a { text-decoration: none; touch-action: manipulation; }
    button { touch-action: manipulation; border: none; background: none; cursor: pointer; font: inherit; color: inherit; }
    label, input, textarea, select { min-height: 44px; font: inherit; }

    /* 装饰光晕（借用 page-floaters 伪元素，不占用 body::before/after 留给视差） */
    .page-floaters::before {
      content: '';
      position: absolute;
      top: -280px;
      right: -180px;
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.45;
      transition: opacity 0.5s;
    }
    .page-floaters::after {
      content: '';
      position: absolute;
      bottom: -220px;
      left: -130px;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.35;
      transition: opacity 0.5s;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 0.3rem 0.9rem 2rem;
      position: relative;
      z-index: 1;
    }
    @media (min-width: 768px) {
      .container { padding: 0.8rem 1.6rem 3rem; }
    }

    /* ========== 导航栏 ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 300;
      background: var(--surface-overlay);
      backdrop-filter: blur(var(--nav-blur));
      -webkit-backdrop-filter: blur(var(--nav-blur));
      border-bottom: 1px solid var(--border);
      padding: 0 0.7rem;
      height: var(--nav-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
      transition: background 0.35s, border-color 0.35s, box-shadow 0.35s;
    }
    @media (min-width: 768px) {
      .navbar { padding: 0 1.8rem; gap: 0.8rem; }
    }
    .navbar.scrolled {
      box-shadow: var(--shadow-md);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: 0.3px;
      color: var(--text);
      font-family: var(--font-serif);
      text-decoration: none;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .nav-brand:hover { color: var(--primary); }

    .nav-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--gradient-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-on-primary);
      font-size: 1.15rem;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      transition: transform 0.3s var(--ease-out-back);
    }
    .nav-brand:hover .nav-avatar {
      transform: scale(1.1) rotate(-5deg);
    }

    .nav-links {
      display: flex;
      gap: 0.1rem;
      align-items: center;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      list-style: none;
      scrollbar-width: none;
      -ms-overflow-style: none;
      max-width: 45vw;
    }
    @media (max-width: 480px) {
      .nav-brand span { display: none; }
      .nav-avatar { width: 36px; height: 36px; font-size: 1rem; }
      .nav-links { max-width: 50vw; }
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 520;
      font-size: 0.78rem;
      padding: 0.35rem 0.55rem;
      border-radius: var(--radius-full);
      transition: color 0.2s, background-color 0.2s;
      white-space: nowrap;
      position: relative;
      flex-shrink: 0;
    }
    @media (min-width: 768px) {
      .nav-links { gap: 0.15rem; flex-wrap: wrap; max-width: none; overflow: visible; }
      .nav-links a { font-size: 0.88rem; padding: 0.45rem 0.9rem; }
    }
    .nav-links a:hover { color: var(--primary); background: var(--primary-soft); }
    .nav-links a:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .nav-links a.active { color: var(--primary); background: var(--primary-soft2); font-weight: 620; }

    .nav-actions {
      display: flex;
      gap: 0.3rem;
      align-items: center;
      flex-shrink: 0;
    }
    @media (min-width: 768px) { .nav-actions { gap: 0.5rem; } }

    /* ========== 按钮系统 ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 580;
      line-height: 1.2;
      cursor: pointer;
      transition: transform 0.2s var(--ease-out), background-color 0.22s, color 0.22s, border-color 0.22s, box-shadow 0.22s;
      text-decoration: none;
      white-space: nowrap;
      user-select: none;
    }
    @media (min-width: 768px) { .btn { padding: 0.6rem 1.2rem; font-size: 0.92rem; } }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.72rem; }
    @media (min-width: 768px) { .btn-sm { padding: 0.45rem 1rem; font-size: 0.82rem; } }
    .btn {
      position: relative;
      overflow: hidden;
    }
    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: transparent;
      transition: background 0.3s;
      border-radius: inherit;
      pointer-events: none;
    }
    .btn:hover::after { background: rgba(0,0,0,0.04); }
    body.dark .btn:hover::after { background: rgba(255,255,255,0.06); }
    .btn:active { transform: scale(0.97); }
    .btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .btn-sm { padding: 0.35rem 0.8rem; font-size: 0.78rem; }
    .btn-lg { padding: 0.65rem 1.5rem; font-size: 0.95rem; font-weight: 600; }
    .btn-primary { background: var(--gradient-primary); color: var(--text-on-primary); border-color: transparent; font-weight: 620; box-shadow: var(--shadow-sm); }
    .btn-primary:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
    .btn-outline { background: transparent; border-color: var(--primary); color: var(--primary); }
    .btn-outline:hover { background: var(--primary); color: var(--text-on-primary); }
    .btn-ghost { background: transparent; border-color: transparent; box-shadow: none; }
    .btn-ghost:hover { background: var(--primary-soft); color: var(--primary); }

    /* ========== 主题选择器 ========== */
    .theme-picker { position: relative; }
    .theme-picker-panel {
      position: absolute;
      top: calc(100% + 0.5rem);
      right: 0;
      min-width: 180px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      padding: 0.5rem;
      z-index: 500;
      opacity: 0;
      transform: translateY(-4px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(.16,1,.3,1);
      transform-origin: top right;
    }
    .theme-picker-panel.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .theme-picker-title {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 620;
      letter-spacing: 1px;
      padding: 0.4rem 0.5rem 0.5rem;
      text-transform: uppercase;
    }
    .theme-swatch {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.5rem 0.6rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 520;
      color: var(--text);
      transition: background 0.2s;
      text-align: left;
      min-height: 44px;
    }
    .theme-swatch:hover { background: var(--primary-soft); }
    .theme-swatch.active { background: var(--primary-soft2); color: var(--primary-dark); font-weight: 620; }
    body.dark .theme-swatch.active { color: var(--primary-light); }
    .sw-preview {
      width: 30px; height: 22px;
      border-radius: 5px;
      flex-shrink: 0;
      border: 1px solid var(--border-light);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .sw-label { display: flex; align-items: center; gap: 0.35rem; }
    .sw-emoji { font-size: 1rem; }

    /* ========== Hero ========== */
    .hero {
      background: var(--gradient-hero);
      border-radius: var(--radius-lg);
      padding: 1.6rem 1.1rem;
      margin: 0.8rem 0 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      text-align: center;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      border: 1px solid var(--border-light);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.4s;
    }
    @media (min-width: 768px) {
      .hero {
        border-radius: var(--radius-xl);
        padding: 2.8rem 2.6rem;
        margin: 1.4rem 0 2.5rem;
        box-shadow: var(--shadow-xl);
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        text-align: left;
        gap: 2.4rem;
      }
    }
    .hero:hover { box-shadow: var(--shadow-2xl); }
    .hero::before {
      content: '';
      position: absolute;
      top: -80px;
      right: -60px;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, var(--accent-soft2) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.5;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: 20px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0.45;
    }
    /* ====== 五大主题专属装饰元素 ====== */
    /* Hero 问候图标 */
    html[data-theme] .hero-greeting::before {
      display: inline-block;
      margin-right: 8px;
      font-size: 1em;
      vertical-align: baseline;
      transform: translateY(-1px);
    }
    html[data-theme="forest"]    .hero-greeting::before { content: '🌲'; }
    html[data-theme="lighthouse"].hero-greeting::before { content: '🏯'; }
    html[data-theme="dusk"]      .hero-greeting::before { content: '🌅'; }
    html[data-theme="dragon"]    .hero-greeting::before { content: '🐉'; }
    html[data-theme="snowpeak"]  .hero-greeting::before { content: '🏔️'; }

    /* 飘浮装饰：全屏 6 个点缀 */
    .page-floaters {
      position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
    }
    .floater {
      position: absolute;
      font-size: 22px;
      opacity: 0.32;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.06));
      animation: float-drift 22s ease-in-out infinite;
    }
    /* 🌲 Forest 森林 */
    html[data-theme="forest"] .floater::before { content: '🍃'; }
    html[data-theme="forest"] .floater[data-n="2"]::before { content: '🌲'; }
    html[data-theme="forest"] .floater[data-n="3"]::before { content: '🍄'; }
    html[data-theme="forest"] .floater[data-n="4"]::before { content: '🦋'; }
    html[data-theme="forest"] .floater[data-n="5"]::before { content: '🌿'; }
    html[data-theme="forest"] .floater[data-n="6"]::before { content: '🍂'; }
    /* 🏯 Lighthouse 灯塔 */
    html[data-theme="lighthouse"] .floater::before { content: '🌊'; }
    html[data-theme="lighthouse"] .floater[data-n="2"]::before { content: '⛵'; }
    html[data-theme="lighthouse"] .floater[data-n="3"]::before { content: '💧'; }
    html[data-theme="lighthouse"] .floater[data-n="4"]::before { content: '🐚'; }
    html[data-theme="lighthouse"] .floater[data-n="5"]::before { content: '🌊'; }
    html[data-theme="lighthouse"] .floater[data-n="6"]::before { content: '🕯️'; }
    /* 🌅 Dusk 暮野 */
    html[data-theme="dusk"] .floater::before { content: '🌾'; }
    html[data-theme="dusk"] .floater[data-n="2"]::before { content: '🌇'; }
    html[data-theme="dusk"] .floater[data-n="3"]::before { content: '🌙'; }
    html[data-theme="dusk"] .floater[data-n="4"]::before { content: '🕊️'; }
    html[data-theme="dusk"] .floater[data-n="5"]::before { content: '🌾'; }
    html[data-theme="dusk"] .floater[data-n="6"]::before { content: '✨'; }
    /* 🐉 Dragon 龙吟 */
    html[data-theme="dragon"] .floater::before { content: '🔴'; }
    html[data-theme="dragon"] .floater[data-n="2"]::before { content: '🐉'; }
    html[data-theme="dragon"] .floater[data-n="3"]::before { content: '🏯'; }
    html[data-theme="dragon"] .floater[data-n="4"]::before { content: '💨'; }
    html[data-theme="dragon"] .floater[data-n="5"]::before { content: '🟢'; }
    html[data-theme="dragon"] .floater[data-n="6"]::before { content: '🐉'; }
    /* 🏔️ Snowpeak 雪峰 */
    html[data-theme="snowpeak"] .floater::before { content: '❄️'; }
    html[data-theme="snowpeak"] .floater[data-n="2"]::before { content: '🏔️'; }
    html[data-theme="snowpeak"] .floater[data-n="3"]::before { content: '⛄'; }
    html[data-theme="snowpeak"] .floater[data-n="4"]::before { content: '☁️'; }
    html[data-theme="snowpeak"] .floater[data-n="5"]::before { content: '❄️'; }
    html[data-theme="snowpeak"] .floater[data-n="6"]::before { content: '🌲'; }

    /* 深色模式下调淡更柔和 */
    body.dark .floater { opacity: 0.22; }
    @keyframes float-drift {
      0%   { transform: translate(0, 0) rotate(0deg); }
      25%  { transform: translate(-8px, -16px) rotate(-6deg); }
      50%  { transform: translate(10px, -30px) rotate(8deg); }
      75%  { transform: translate(6px, -14px) rotate(-4deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    /* 触屏设备禁用飘浮动画（省电） */
    @media (hover: none) and (pointer: coarse) {
      .floater { display: none; }
    }

    /* ========== ⑤ 技能卡片悬停气泡（详情提示） ========== */
    .skill-card { position: relative; }
    .skill-tooltip {
      position: absolute;
      left: 50%; bottom: calc(100% + 10px);
      transform: translateX(-50%) translateY(6px);
      background: var(--primary-dark);
      color: var(--text-on-primary);
      font-size: 0.76rem;
      line-height: 1.5;
      padding: 0.55rem 0.85rem;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-md);
      white-space: normal;
      width: max-content;
      max-width: 260px;
      min-width: 160px;
      text-align: left;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.25s var(--ease-out-expo);
      z-index: 80;
    }
    .skill-tooltip::after {
      content: '';
      position: absolute;
      left: 50%; top: 100%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--primary-dark);
    }
    body.dark .skill-tooltip { background: var(--primary-light); color: var(--text-on-primary); }
    body.dark .skill-tooltip::after { border-top-color: var(--primary-light); }
    .skill-card:hover .skill-tooltip,
    .skill-card:focus-within .skill-tooltip {
      opacity: 1;

    /* 性能：减少离屏渲染工作 */

      backdrop-filter: saturate(180%) blur(var(--nav-blur));

      border-bottom: 1px solid var(--border-light);
    }

      transform: translateY(-110%);
    }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
      background: var(--surface); color: var(--text); padding: 0.65rem 1.6rem;
      border-radius: var(--radius-full); box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      font-size: 0.84rem; font-weight: 550; z-index: 400; transition: transform 0.35s var(--ease-out-back);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .nav-actions .btn-mini {
      padding: 0 0.6rem !important;
      font-size: 0.9rem !important;
      width: 40px !important;
      height: 40px !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
    }
    .share-modal, .lang-btn, .pdf-btn { font-family: inherit; }
    /* 分享弹窗 */
    .modal-mask {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-mask.show { opacity: 1; pointer-events: auto; }
    .share-modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 100%; max-width: 360px;
      max-height: calc(100vh - 2rem);
      overflow-y: auto;
      box-shadow: var(--shadow-2xl);
      border: 1px solid var(--border-light);
      transform: translateY(16px) scale(0.97);
      transition: transform 0.3s var(--ease-out-back);
    }
    .modal-mask.show .share-modal { transform: translateY(0) scale(1); }
    .share-modal h3 { font-size: 1.1rem; margin-bottom: 0.3rem; color: var(--text); }
    .share-modal .share-sub { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 1rem; }
    .share-qr {
      background: #fff;
      padding: 14px;
      border-radius: var(--radius-md);
      width: 200px; height: 200px;
      margin: 0 auto 1rem;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 0 0 1px #eee;
    }
    .share-qr canvas, .share-qr img { width: 100%; height: 100%; display: block; }
    .share-url {
      font-size: 0.78rem;
      padding: 0.6rem 0.8rem;
      background: var(--bg-alt);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      word-break: break-all;
      color: var(--text-secondary);
      margin-bottom: 1rem;
      line-height: 1.45;
    }
    .share-actions { display: flex; gap: 0.5rem; }
    .share-actions button { flex: 1; min-height: 44px; }
    .modal-close {
      position: absolute; top: 0.8rem; right: 0.8rem;
      background: transparent; border: none;
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }
    .modal-close:hover { background: var(--primary-soft); color: var(--primary); }

    /* ========== ⑥ 证书灯箱左右切换 + 页码 ========== */
    .lightbox {
      display: flex; align-items: center; justify-content: center;
    }
    .lightbox-inner {
      position: relative;
      max-width: 92vw; max-height: 88vh;
      display: flex; flex-direction: column; align-items: center;
    }
    .lightbox-img-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      max-width: 92vw; max-height: 78vh;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px; height: 46px;
      border-radius: 50%;
      background: rgba(0,0,0,0.55);
      color: #fff;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
      transition: background 0.2s, transform 0.2s;
      z-index: 2;
    }
    .lightbox-nav:hover { background: rgba(0,0,0,0.75); transform: translateY(-50%) scale(1.08); }
    .lightbox-prev { left: calc(0px - max(1vw, 10px)); }
    .lightbox-next { right: calc(0px - max(1vw, 10px)); }
    @media (max-width: 640px) {
      .lightbox-prev { left: 6px; }
      .lightbox-next { right: 6px; }
      .lightbox-nav { width: 40px; height: 40px; font-size: 1rem; }
    }
    .lightbox-page {
      margin-top: 0.8rem;
      padding: 0.4rem 1rem;
      border-radius: var(--radius-full);
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 550;
      backdrop-filter: blur(4px);
    }
    .lightbox-caption {
      margin-top: 0.5rem;
      padding: 0.4rem 0.8rem;
      color: rgba(255,255,255,0.85);
      font-size: 0.8rem;
      text-align: center;
      max-width: 80vw;
    }

    .certs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.45rem;
    }
    @media (min-width: 520px) {
      .certs-grid { grid-template-columns: repeat(2, 1fr); gap: 0.55rem; }
    }
    @media (min-width: 900px) {
      .certs-grid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0.65rem; }
    }
    .cert-card {
      background: var(--gradient-card);
      border: 1px solid var(--border-light);
      border-left: 3px solid var(--primary);
      border-radius: var(--radius-sm);

      align-items: flex-start;

    }

    .cert-card-info {

      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }
    @media (min-width: 768px) { .cert-card-info { gap: 0.15rem; } }
    .cert-card-name {
      font-weight: 680;
      font-size: 0.8rem;
      color: var(--text);
      line-height: 1.3;
    }
    @media (min-width: 768px) { .cert-card-name { font-size: 0.85rem; } }
    .cert-card-org {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 550;
    }
    @media (min-width: 768px) { .cert-card-org { font-size: 0.74rem; } }
    .cert-card-meta {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    @media (min-width: 768px) {
      .cert-card-meta { font-size: 0.7rem; gap: 0.6rem; }
    }

    /* 证书图片灯箱 */
    .img-lightbox {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,0.88); backdrop-filter: blur(6px);
      display: none; align-items: center; justify-content: center;
      padding: 0.6rem;
    }
    @media (min-width: 768px) { .img-lightbox { padding: 2rem; } }
    .img-lightbox.show { display: flex; }
    .img-lightbox img {
      max-width: 96vw; max-height: 88vh;
      border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      object-fit: contain;
    }
    @media (min-width: 768px) {
      .img-lightbox img { max-width: 92vw; max-height: 88vh; border-radius: 10px; }
    }
    .img-lightbox-close {
      position: fixed; top: calc(0.7rem + env(safe-area-inset-top)); right: calc(0.7rem + env(safe-area-inset-right));
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.15); color: #fff;
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 1.2rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; z-index: 10000;
    }
    @media (min-width: 768px) {

              <div class="contact-card-title card-inner" style="font-weight:620;margin-top:0.4rem;">${t('contact.card.emailTitle')}</div>

            <div class="stat-card tilt-card" style="cursor:pointer;" id="contact-card-wechat">
              <span class="stat-icon card-inner">💬</span>

              <div class="contact-card-sub card-inner" style="color:var(--text-muted);font-size:0.78rem;margin-top:0.15rem;">${t('contact.card.wechatSub')}</div>
            </div>
            <div class="stat-card tilt-card" style="cursor:pointer;" id="contact-card-phone">
              <span class="stat-icon card-inner">📱</span>
              <div class="stat-number card-inner" style="font-size:1rem;font-family:var(--font-sans);font-weight:600;">${resume.contact.phone}</div>
              <div class="contact-card-title card-inner" style="font-weight:620;margin-top:0.4rem;">${t('contact.card.phoneTitle')}</div>
              <div class="contact-card-sub card-inner" style="color:var(--text-muted);font-size:0.78rem;margin-top:0.15rem;">${t('contact.card.phoneSub')}</div>
            </div>
            <div class="stat-card tilt-card" style="cursor:default;" id="contact-card-location">
              <span class="stat-icon card-inner">📍</span>
              <div class="stat-number card-inner" id="contactLocationNumber" style="font-size:1rem;font-family:var(--font-sans);font-weight:600;">${pickF(resume.contact, 'city')}</div>
              <div class="contact-card-title card-inner" style="font-weight:620;margin-top:0.4rem;">${t('contact.card.locationTitle')}</div>
              <div class="contact-card-sub card-inner" style="color:var(--text-muted);font-size:0.78rem;margin-top:0.15rem;">${t('contact.card.locationSub')}</div>
            </div>
          </div>
        </section>`;

        main.innerHTML = html;

        // 抽成独立函数：数据驱动 DOM 全部重新渲染（首次 build + 切换语言时调用）
        window.renderDataDrivenSections = function() {
          const L = window.__LANG;
          const certExpiryPermanent = L === 'en' ? '✅ Permanent' : '✅ 长期';
          const imgPlaceholderText = L === 'en' ? '📎 Placeholder: ' : '📎 图片占位：';
          const orgForImgAlt = function(it){ return pickF(it, 'org'); };

          // ---------- 经历 Tabs ----------
          const expNav = document.getElementById('expTabNav');
          const expPanels = document.getElementById('expTabPanels');
          if (expNav && expPanels) {
            expNav.innerHTML = '';
            expPanels.innerHTML = '';
            const displayKeys = resume.experienceTabKeys[window.__LANG] || resume.experienceTabKeys.zh || [];
            const zhKeys = resume.experienceTabKeys.zh;
            displayKeys.forEach((displayKey, idx) => {
              const tabId = `exp-tab-${idx}`;
              const panelId = `exp-panel-${idx}`;
              expNav.innerHTML += `<button class="tab-btn" id="${tabId}" role="tab" aria-selected="${idx===0?'true':'false'}" aria-controls="${panelId}" data-panel="${panelId}">${displayKey}</button>`;
              const zhKey = zhKeys[idx];
              const items = resume.experienceTabs[zhKey] || [];
              let panelHtml = `<div class="tab-panel ${idx===0?'active':''}" id="${panelId}" role="tabpanel"><div class="timeline">`;
              items.forEach(item => {
                let imgHtml = '';
                if (item.images && item.images.length) {
                  imgHtml = `<div class="exp-images">${item.images.map(src=>`<img class="exp-img" src="${src}" alt="${orgForImgAlt(item)}" loading="lazy" decoding="async" width="180" height="380" onerror="this.style.display='none';let p=document.createElement('span');p.className='exp-img-ph';p.innerHTML='${imgPlaceholderText}'+this.src;this.parentNode.appendChild(p)">`).join('')}</div>`;
                }
                const role = pickF(item, 'role');
                const org = pickF(item, 'org');
                const hs = pickArr(item, 'highlights');
                panelHtml += `<div class="timeline-item"><div class="timeline-dot"></div><div class="timeline-date">${item.date}</div><div class="card" style="margin-bottom:0;"><div class="card-header"><span class="card-title">${role}</span><span class="card-subtitle">${org}</span></div><div class="card-desc"><ul>${hs.map(h=>`<li>${h}</li>`).join('')}</ul>${imgHtml}</div></div></div>`;
              });
              panelHtml += `</div></div>`;
              expPanels.innerHTML += panelHtml;
            });
          }

          // ---------- Projects ----------
          const projectsGrid = document.getElementById('projectsGrid');
          if (projectsGrid) {
            projectsGrid.innerHTML = resume.projects.map(p => {
              const tech = pickArr(p, 'tech');
              return `
              <div class="project-card tilt-card">
                <div class="project-icon card-inner">${p.icon}</div>
                <div class="project-name card-inner">${pickF(p, 'name')}</div>
                <p class="project-desc card-inner">${pickF(p, 'desc')}</p>
                <div class="project-tech card-inner">${tech.map(t=>`<span>${t}</span>`).join('')}</div>
                <div class="project-result card-inner">🏆 ${pickF(p, 'result')}</div>
              </div>`;
            }).join('');
          }

          // ---------- Skills ----------
          const skillsGrid = document.getElementById('skillsGrid');
          if (skillsGrid) {
            skillsGrid.innerHTML = resume.skillCategories.map(s => `
              <div class="skill-card tilt-card" tabindex="0">
                <div class="skill-icon-wrap card-inner">${s.icon}</div>
                <div class="skill-info card-inner">
                  <div class="skill-name">${pickF(s, 'name')}</div>
                  <div class="skill-tags">${pickF(s, 'tags')}</div>
                  <div class="skill-bar-bg"><div class="skill-bar-fill" style="--target:${s.level}%"></div></div>
                </div>
                ${s.detail ? `<div class="skill-tooltip" role="tooltip">${pickF(s, 'detail')}</div>` : ''}
              </div>`).join('');
          }

          // ---------- Certificates grid ----------
          const certsGrid = document.getElementById('certsGrid');
          if (certsGrid) {
            const certIcons = ['🤖','🧠','🕹️','⚙️','💻','🎓','📝','🔧','🦾','📊','🏗️','🚀','⌨️','🌐','🐍'];
            certsGrid.innerHTML = resume.certificates.map((c, idx) => `
              <div class="cert-card tilt-card" data-idx="${idx}">
                <span class="cert-card-icon card-inner">${certIcons[idx] || '📜'}</span>
                <div class="cert-card-info card-inner">
                  <div class="cert-card-name">${pickF(c, 'name')}</div>
                  <div class="cert-card-org">${pickF(c, 'org')}</div>
                  <div class="cert-card-meta">
                    <span>🗓️ ${c.date}</span>
                    ${c.expiry !== '-' ? `<span>⏳ ${c.expiry}</span>` : `<span>${certExpiryPermanent}</span>`}
                    ${c.id !== '-' ? `<span>#${c.id.slice(-6)}</span>` : ''}
                  </div>
                </div>
              </div>`).join('');
          }

          // ---------- Education ----------
          const eduCard = document.getElementById('educationCard');
          if (eduCard) {
            eduCard.innerHTML = `
              <div class="card-header"><span class="card-title">${pickF(resume.education, 'school')}</span><span class="card-subtitle">${resume.education.period}</span></div>
              <p style="font-weight:620;">${pickF(resume.education, 'degree')}</p>
              <div class="card-desc" style="margin-top:0.5rem;"><ul>${pickArr(resume.education, 'details').map(d=>`<li>${d}</li>`).join('')}</ul></div>`;
          }

          // ---------- Awards ----------
          const awardsCard = document.getElementById('awardsCard');
          if (awardsCard) {
            const summaryTitle = L === 'en' ? '📋 Certificate Summary' : '📋 证书摘要';
            awardsCard.innerHTML = `<h3 style="font-size:0.95rem;color:var(--accent);margin-bottom:0.6rem;font-weight:700;">${summaryTitle}</h3><div class="card-desc"><ul>${resume.awards.map(a=>`<li><strong>${pickF(a, 'name')}</strong>${(pickF(a,'note'))?' — '+pickF(a,'note'):''}</li>`).join('')}</ul></div>`;
          }

          // ---------- Traits ----------
          const traitsCard = document.getElementById('traitsCard');
          if (traitsCard) {
            traitsCard.innerHTML = `<div class="card-desc"><ul>${pickArr(resume, 'traits').map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
          }

          // ---------- Hero 数据字段 ----------
          const heroSub = document.getElementById('heroSubtitle');
          if (heroSub) heroSub.textContent = pickF(resume, 'titles').join(' · ');
          const heroTag = document.getElementById('heroTagline');
          if (heroTag) heroTag.textContent = pickF(resume, 'tagline');
          const heroCity = document.getElementById('heroCityBadge');
          if (heroCity) heroCity.textContent = '📍 ' + pickF(resume.contact, 'city');
          const locNum = document.getElementById('contactLocationNumber');
          if (locNum) locNum.textContent = pickF(resume.contact, 'city');
          // Hero 主标题 + 副标题名（中英文切换大小）
          const heroH1 = document.querySelector('#hero h1');
          if (heroH1) {
            const pName = L === 'en' ? resume.nameEn : resume.name;
            const sName = L === 'en' ? resume.name : resume.nameEn;
            heroH1.innerHTML = `<span class="hero-name">${pName}</span> <span style="font-weight:400;font-size:0.55em;color:var(--text-muted);">${sName}</span>`;
          }
          // 头像已改为照片，不再切换文字
          // 导航栏 头像 + 品牌名 双语切换
          const navAvatar = document.getElementById('navAvatar');
          if (navAvatar) navAvatar.textContent = L === 'en' ? 'Z' : '赵';
          const navBrand = document.getElementById('navBrand');
          if (navBrand) navBrand.textContent = L === 'en' ? resume.nameEn : resume.name;
          // 页脚品牌名双语切换
          const footerBrand = document.getElementById('footerBrand');
          if (footerBrand) {
            footerBrand.textContent = L === 'en'
              ? `${resume.nameEn} · ${resume.name}`
              : `${resume.name} · ${resume.nameEn}`;
          }
          // 灯箱默认 img alt 属性
          const lbImg = document.getElementById('imgLightboxImg');
          if (lbImg) lbImg.setAttribute('alt', L === 'en' ? 'Certificate image' : '证书图片');
          // hero 出生年份 badge 后缀（已有后处理 7 兜底，这里再同步一次避免遗漏）
          const bornBadge = document.getElementById('heroBornBadge');
          if (bornBadge && resume.contact && resume.contact.birthYear) {
            const suffix = L === 'en' ? ' born' : '年生';
            bornBadge.textContent = '🎂 ' + resume.contact.birthYear + suffix;
          }
          // highlights 4 张卡
          resume.highlights.forEach((h, idx) => {
            const nEl = document.getElementById('stat-number-' + idx);
            const lEl = document.getElementById('stat-label-' + idx);
            if (nEl) nEl.textContent = pickF(h, 'number');
            if (lEl) lEl.textContent = pickF(h, 'label');
          });
        };

        // 首次渲染
        window.renderDataDrivenSections();

        bindEvents();
      }

      function bindEvents() {
        // Tab 切换
        document.querySelectorAll('.tab-nav').forEach(nav => {
          nav.addEventListener('click', e => {
            const btn = e.target.closest('.tab-btn');
            if (!btn) return;
            const panelId = btn.dataset.panel;
            nav.querySelectorAll('.tab-btn').forEach(b => { b.setAttribute('aria-selected','false'); });
            btn.setAttribute('aria-selected','true');
            nav.nextElementSibling.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
          });
        });

        // 复制按钮：邮箱 / 微信 / 手机号，带 Toast 反馈
        const copyMap = [
          ['copyEmailBtn',  resume.contact.email,  t('toast.email')],
          ['copyWechatBtn', resume.contact.wechat, t('toast.wechat')],
          ['copyPhoneBtn',  resume.contact.phone,  t('toast.phone')]
        ];
        copyMap.forEach(([id, text, msg]) => {
          document.getElementById(id)?.addEventListener('click', () => {
            copyText(text, msg);
          });
        });

        // 联系区块卡片点击复制
        const contactCardMap = [
          ['contact-card-email',  resume.contact.email,  t('toast.email')],
          ['contact-card-wechat', resume.contact.wechat, t('toast.wechat')],
          ['contact-card-phone',  resume.contact.phone,  t('toast.phone')]
        ];
        contactCardMap.forEach(([id, text, msg]) => {
          document.getElementById(id)?.addEventListener('click', () => {
            copyText(text, msg);
          });
        });

        // 导航高亮 + 导航滚动收起 + 阅读进度条（滚动监听统一入口）
        let lastScrollY = window.scrollY;
        let ticking = false;
        function onScrollUpdate() {
          const y = window.scrollY;
          navbar.classList.toggle('scrolled', y > 20);
          backBtn.classList.toggle('visible', y > 500);

          // 导航栏滚动收起：下滑隐藏、上滑显示
          if (window.innerWidth >= 640) {
            const delta = y - lastScrollY;
            if (y > 120) {
              if (delta > 4)  navbar.classList.add('nav-hidden');   // 快速下滑 → 收起
              if (delta < -4) navbar.classList.remove('nav-hidden');
            } else {
              navbar.classList.remove('nav-hidden');
            }
          } else {
            navbar.classList.remove('nav-hidden');
          }
          lastScrollY = y;

          // 阅读进度条
          const docH = document.documentElement.scrollHeight - window.innerHeight;
          const pct = docH > 0 ? (y / docH) * 100 : 0;
          document.getElementById('readProgressBar')?.style.setProperty('width', pct + '%');

          // 当前section高亮
          const sections = document.querySelectorAll('section[id]');
          let current = '';
          sections.forEach(s => { if (y >= s.offsetTop - 150) current = s.id; });
          document.querySelectorAll('.nav-links a').forEach(a => {
            a.classList.remove('active');
            if (a.getAttribute('href') === `#${current}`) a.classList.add('active');
          });
          ticking = false;
        }
        window.addEventListener('scroll', () => {
          if (!ticking) {
            window.requestAnimationFrame(onScrollUpdate);
            ticking = true;
          }
        }, { passive: true });
        window.dispatchEvent(new Event('scroll'));

        // ========== 证书灯箱（支持翻页 + 键盘 + 页码 + Caption） ==========
        // 灯箱数据列表：证书+经历图片统一使用同一翻页列表（点击时按类型重建）
        window.__LIGHTBOX = { list: [], idx: 0 };
        const imgLightbox = document.getElementById('imgLightbox');
        const lbImg = document.getElementById('imgLightboxImg');
        const lbPage = document.getElementById('lightboxPage');
        const lbCaption = document.getElementById('lightboxCaption');
        const lbPrev = document.getElementById('lightboxPrev');
        const lbNext = document.getElementById('lightboxNext');

        function renderLightbox() {
          const L = window.__LIGHTBOX;
          if (!L.list.length) return;
          const item = L.list[L.idx];
          const ph = document.getElementById('lightboxPlaceholder');
          if (ph) ph.remove();
          lbImg.onerror = function() {
            this.onerror = null;
            this.src = '';
            this.style.display = 'none';
            let ph2 = document.getElementById('lightboxPlaceholder');
            if (!ph2) {
              ph2 = document.createElement('div');
              ph2.id = 'lightboxPlaceholder';
              ph2.style.cssText = 'color:#ccc;text-align:center;font-size:1.1rem;line-height:1.8;';
              lbImg.parentNode.insertBefore(ph2, lbImg.nextSibling);
            }
            const tPlaceholder = window.__LANG === 'en'
              ? '📜 Image not found<br><span style="font-size:0.85rem;opacity:0.7;">Please put the certificate image at<br>' + (item.src || '') + '</span>'
              : '📜 图片未找到<br><span style="font-size:0.85rem;opacity:0.7;">请将证书图片放入<br>' + (item.src || '') + '</span>';
            ph2.innerHTML = tPlaceholder;
          };
          lbImg.src = item.src;
          lbImg.alt = item.alt || '';
          lbImg.style.display = 'block';
          lbCaption.textContent = item.caption || '';
          const fmt = window.__LB_PAGE_FMT || (window.__LANG === 'en' ? '{n} / {total}' : '第 {n} / {total} 张');
          lbPage.textContent = fmt.replace('{n}', String(L.idx + 1)).replace('{total}', String(L.list.length));
          lbPrev.disabled = L.list.length <= 1;
          lbNext.disabled = L.list.length <= 1;
        }
        // 暴露给外部（双语切换更新页码）
        window.__renderLightbox = renderLightbox;
        function lightboxPrev() { const L=window.__LIGHTBOX; L.idx=(L.idx-1+L.list.length)%L.list.length; renderLightbox(); }
        function lightboxNext() { const L=window.__LIGHTBOX; L.idx=(L.idx+1)%L.list.length; renderLightbox(); }
        function openLightbox(list, startIdx) {
          window.__LIGHTBOX = { list, idx: startIdx||0 };
          renderLightbox();
          imgLightbox.classList.add('show');
          document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
          imgLightbox.classList.remove('show');
          document.body.style.overflow = '';
        }
        lbPrev.addEventListener('click', lightboxPrev);
        lbNext.addEventListener('click', lightboxNext);
        document.getElementById('imgLightboxClose').addEventListener('click', closeLightbox);
        imgLightbox.addEventListener('click', e => { if (e.target === imgLightbox) closeLightbox(); });

        // 证书卡片点击 → 打开灯箱（全部证书作为一个列表）+ 经历图片点击（单张）
        window.bindImageLightboxTriggers = function() {
          document.querySelectorAll('.cert-card').forEach(card => {
            card.addEventListener('click', () => {
              const idx = parseInt(card.dataset.idx, 10);
              const list = resume.certificates.map(c => {
                const cn = pickF(c, 'name');
                const co = pickF(c, 'org');
                return { src: c.img, caption: `${cn} · ${co}`, alt: cn };
              });
              openLightbox(list, idx);
            });
          });
          document.querySelectorAll('.exp-img').forEach(img => {
            img.addEventListener('click', () => {
              const cap = img.alt || (window.__LANG === 'en' ? 'Experience image' : '经历图片');
              openLightbox([{ src: img.src, caption: cap, alt: img.alt || cap }], 0);
            });
          });
        };
        window.bindImageLightboxTriggers();

        // 键盘：灯箱 ←/→/Esc
        document.addEventListener('keydown', e => {
          if (!imgLightbox.classList.contains('show')) return;
          if (e.key === 'Escape') closeLightbox();
          if (e.key === 'ArrowLeft')  lightboxPrev();
          if (e.key === 'ArrowRight') lightboxNext();
        });
      }

      // ==================== Toast 工具 ====================
      function showToast(msg, type) {
        let t = document.getElementById('toast');
        if (!t) {
          t = document.createElement('div');
          t.id = 'toast';
          t.className = 'toast';
          t.setAttribute('aria-live','polite');
          document.body.appendChild(t);
        }
        t.textContent = msg;
        t.className = 'toast show' + (type === 'error' ? ' error' : '');
        clearTimeout(t.__h);
        t.__h = setTimeout(() => { t.classList.remove('show'); }, 2200);
      }
      function copyText(text, okMsg) {
        const done = okMsg || '✅ 已复制';
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(() => showToast(done), () => fallbackCopy(text, done));
        } else {
          fallbackCopy(text, done);
        }
      }
      function fallbackCopy(text, done) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
          document.body.appendChild(ta); ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(done);
        } catch {
          const msg = window.__LANG === 'en'
            ? '❌ Copy failed, please copy manually: '
            : '❌ 复制失败，请手动复制：';
          showToast(msg + text, 'error');
        }
      }

      // ==================== 主题系统（5个图片主题 + 深浅切换 + 切换涟漪） ====================
      const THEME_LIST = ['forest','lighthouse','dusk','dragon','snowpeak'];
      const themePickerBtn = document.getElementById('themePickerBtn');
      const themePickerPanel = document.getElementById('themePickerPanel');

      function setThemePalette(themeName, origin) {
        if (!THEME_LIST.includes(themeName)) themeName = 'forest';
        // 涟漪扩散
        if (origin) playThemeRipple(origin.x, origin.y, themeName);
        document.documentElement.setAttribute('data-theme', themeName);
        localStorage.setItem('palette', themeName);
        document.querySelectorAll('.theme-swatch').forEach(sw => {
          sw.classList.toggle('active', sw.dataset.theme === themeName);
        });
      }
      function playThemeRipple(x, y, themeName) {
        try {
          const rp = document.createElement('div');
          rp.className = 'ripple-burst';
          rp.style.left = x + 'px';
          rp.style.top = y + 'px';
          document.body.appendChild(rp);
          rp.addEventListener('animationend', () => rp.remove(), { once: true });
        } catch(e){ /* noop */ }
      }
      function closeThemePanel() { themePickerPanel.classList.remove('show'); }
      themePickerBtn.addEventListener('click', e => {
        e.stopPropagation();
        themePickerPanel.classList.toggle('show');
      });
      document.addEventListener('click', e => {
        if (!themePickerPanel.contains(e.target) && e.target !== themePickerBtn) closeThemePanel();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') closeThemePanel(); });
      document.querySelectorAll('.theme-swatch').forEach(sw => {
        sw.addEventListener('click', e => {
          const r = sw.getBoundingClientRect();
          const origin = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
          setThemePalette(sw.dataset.theme, origin);
          closeThemePanel();
        });
      });

      function syncDarkIcon() {
        const isDark = body.classList.contains('dark');
        themeBtn.innerHTML = isDark ? '☀️' : '🌙';
        themeBtn.title = isDark ? t('ui.modeLight') : t('ui.modeDark');
      }
      themeBtn.addEventListener('click', e => {
        body.classList.toggle('dark');
        const isDark = body.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        syncDarkIcon();

      // ==================== 入场动画 / 技能填充 / 摆动图标 ====================
      function setupRevealAnimations() {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) {
          document.querySelectorAll('.fade-up').forEach(el => el.classList.add('in'));
          document.querySelectorAll('.skill-bar-fill').forEach(el => el.classList.add('fill'));
          document.querySelectorAll('.section-icon').forEach(el => el.classList.add('in'));
          return;
        }

        document.querySelectorAll('.stat-card, .card, .project-card, .skill-card, .cert-card, .hero, .tab-panel > .card, .awards-summary, .about-points > li').forEach((el, i) => {
          if (!el.classList.contains('fade-up')) el.classList.add('fade-up');
          el.style.transitionDelay = (Math.min(i % 8, 6) * 55) + 'ms';
        });

        const io = new IntersectionObserver((entries) => {
          entries.forEach(en => {
            if (!en.isIntersecting) return;
            const el = en.target;
            if (el.classList.contains('fade-up')) el.classList.add('in');
            if (el.classList.contains('section-icon')) el.classList.add('in');
            if (el.classList.contains('skill-card')) {
              const bar = el.querySelector('.skill-bar-fill');
              if (bar) bar.classList.add('fill');
            }
            io.unobserve(el);
          });
        }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });

        document.querySelectorAll('.fade-up, .section-icon, .skill-card').forEach(el => io.observe(el));
      }

      // ==================== 视差乙：背景光晕 + Hero 视差 ====================
      function setupParallax() {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const coarse = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        if (reduced || coarse) return;

        let ticking = false;
        const HALO_RATE = 0.3;

        function updateParallax() {
          const y = window.scrollY;
          const warmY = - y * HALO_RATE;
          const coolY = y * HALO_RATE;
          document.body.style.setProperty('--hw-y', `calc(5% + ${warmY}px)`);
          document.body.style.setProperty('--hc-y', `calc(35% + ${coolY}px)`);
          const tilt = Math.sin(y / 1200) * 3;
          document.body.style.setProperty('--hw-x', `calc(8% + ${-tilt}%)`);
          document.body.style.setProperty('--hc-x', `calc(88% + ${tilt}%)`);
          ticking = false;
        }

        window.addEventListener('scroll', () => {
          if (!ticking) {
            window.requestAnimationFrame(updateParallax);
            ticking = true;
          }
        }, { passive: true });

        updateParallax();
      }

      // ==================== 卡片悬停光晕（鼠标位置） ====================
      function setupCardGlow() {
        const coarse = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        if (coarse) return;
        const cards = document.querySelectorAll('.card, .stat-card, .project-card, .skill-card, .cert-card');
        cards.forEach(card => {
          card.addEventListener('pointermove', e => {
            const r = card.getBoundingClientRect();
            const x = ((e.clientX - r.left) / r.width) * 100;
            const y = ((e.clientY - r.top) / r.height) * 100;
            card.style.setProperty('--mx', x + '%');
            card.style.setProperty('--my', y + '%');
          });
        });
      }

      // ==================== ⑧ 卡片 3D 倾斜悬停（桌面端） ====================
      function setupTiltCard() {
        const coarse = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (coarse || reduced) return;
        const cards = document.querySelectorAll('.tilt-card');
        cards.forEach(card => {
          card.addEventListener('pointermove', e => {
            const r = card.getBoundingClientRect();
            const px = (e.clientX - r.left) / r.width;   // 0~1
            const py = (e.clientY - r.top) / r.height;
            const rx = (0.5 - py) * 12;   // 上下旋转
            const ry = (px - 0.5) * 14;   // 左右旋转
            card.style.transform = `perspective(900px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) translateY(-2px)`;
            card.querySelectorAll('.card-inner').forEach(el => {
              const dx = (px - 0.5) * 6;
              const dy = (py - 0.5) * 6;
              el.style.transform = `translate3d(${dx}px, ${dy}px, 18px)`;
            });
          });
          card.addEventListener('pointerleave', () => {
            card.style.transform = '';
            card.querySelectorAll('.card-inner').forEach(el => el.style.transform = '');
          });
        });
      }

      // ==================== ⑩ Hero标题 + section标题 逐字入场动画 ====================
      function setupCharAnimation() {
        const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const targets = [
          { el: document.querySelector('.hero-name'),  attr: 'hero-name'  },
          { el: document.querySelector('.hero-title'), attr: 'hero-title' }
        ].concat(Array.from(document.querySelectorAll('.section-title')).map(el => ({ el, attr: 'sec-title' })));

        targets.forEach(({ el, attr }) => {
          if (!el) return;
          // 原文本（取textContent，避免破坏子元素结构：.hero-title 里可能有emoji）
          const origText = el.textContent || '';
          if (!origText.trim().length) return;
          // 逐字拆
          const chars = Array.from(origText);
          el.innerHTML = chars.map((ch, i) => {
            if (ch === ' ') return `<span class="cg" style="display:inline-block;width:0.35em"></span>`;
            return `<span class="cg cg--${attr}" style="--ci:${i}">${ch}</span>`;
          }).join('');
          // 进入视口触发
          const io = new IntersectionObserver((entries) => {
            entries.forEach(en => {
              if (!en.isIntersecting) return;
              en.target.querySelectorAll('.cg').forEach(s => s.classList.add('in'));
              io.disconnect();
            });
          }, { threshold: 0.25 });
          io.observe(el);
        });
      }

      // ==================== ⑫ 分享弹窗 + 二维码（CDN 动态加载 QRCode.js） ====================
      let __qrReady = false;
      function loadQRLib() {
        if (__qrReady || window.QRCode) { __qrReady = true; return Promise.resolve(); }
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
          s.async = true;
          s.onload  = () => { __qrReady = true; resolve(); };

          document.head.appendChild(s);

      function setupShareModal() {
        const mask = document.getElementById('shareModalMask');
